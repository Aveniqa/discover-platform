name: Daily Surfaced Edition

on:
  # Maintenance mode: the site stays fresh without spending daily model/API,
  # GitHub Actions, and Cloudflare deploy credits. Manual dispatch can run a
  # larger refresh when Surfaced is actively being worked on again.
  schedule:
    - cron: '0 11 * * 1,3,5' # Morning ET on Mon/Wed/Fri
  workflow_dispatch:
    inputs:
      content_budget:
        description: "How much fresh content to generate per live category"
        required: true
        default: "low"
        type: choice
        options:
          - low
          - normal
      refresh_media:
        description: "Capture screenshots and fetch stock images"
        required: true
        default: false
        type: boolean
      send_newsletter:
        description: "Send the Buttondown newsletter after a clean build"
        required: true
        default: false
        type: boolean

concurrency:
  group: daily-edition
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  daily-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set automation budget
        id: budget
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONTENT_BUDGET: ${{ github.event.inputs.content_budget || 'low' }}
          REFRESH_MEDIA_INPUT: ${{ github.event.inputs.refresh_media || 'false' }}
          SEND_NEWSLETTER_INPUT: ${{ github.event.inputs.send_newsletter || 'false' }}
        run: |
          set -euo pipefail

          case "${CONTENT_BUDGET:-low}" in
            normal)
              rotate=5
              target=5
              minimum=2
              attempts=7
              ;;
            low|*)
              rotate=2
              target=2
              minimum=1
              attempts=3
              ;;
          esac

          refresh_media="${REFRESH_MEDIA_INPUT:-false}"
          send_newsletter="${SEND_NEWSLETTER_INPUT:-false}"

          # Scheduled maintenance only does media/API-heavy garnish once a week.
          # The content itself still refreshes on every scheduled run.
          if [ "$EVENT_NAME" = "schedule" ]; then
            if [ "$(date -u +%u)" = "1" ]; then
              refresh_media=true
              send_newsletter=true
            else
              refresh_media=false
              send_newsletter=false
            fi
          fi

          {
            echo "DAILY_ROTATE_COUNT=$rotate"
            echo "DAILY_TARGET_PER_CATEGORY=$target"
            echo "DAILY_MIN_PER_CATEGORY=$minimum"
            echo "DAILY_MAX_GENERATION_ATTEMPTS=$attempts"
          } >> "$GITHUB_ENV"

          {
            echo "refresh_media=$refresh_media"
            echo "send_newsletter=$send_newsletter"
          } >> "$GITHUB_OUTPUT"

          echo "Budget: ${CONTENT_BUDGET:-low}"
          echo "Per category: rotate=$rotate target=$target minimum=$minimum attempts=$attempts"
          echo "Media refresh: $refresh_media"
          echo "Newsletter: $send_newsletter"

      - name: Validate secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          REFRESH_MEDIA: ${{ steps.budget.outputs.refresh_media }}
        run: |
          [ -n "$GEMINI_API_KEY" ] || (echo "❌ GEMINI_API_KEY is not set" && exit 1)
          if [ "$REFRESH_MEDIA" = "true" ] && [ -z "$PEXELS_API_KEY" ]; then
            echo "⚠️ PEXELS_API_KEY is not set — images will not be fetched"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install Agent Reach
        # Grounds generation in each candidate's own page and gathers GitHub /
        # YouTube signals (scripts/lib/agent-reach.js). Pinned release; every
        # caller falls back to the pre-Agent-Reach behaviour if this fails.
        continue-on-error: true
        run: |
          pipx install uv==0.11.8
          "$HOME/.local/bin/uv" tool install https://github.com/Panniantong/Agent-Reach/releases/download/v1.6.0/agent-reach.zip
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/agent-reach" version

      - name: Remove oldest items
        run: node scripts/daily-rotate.js --run

      - name: Generate fresh content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AMAZON_AFFILIATE_TAG: ${{ secrets.AMAZON_AFFILIATE_TAG }}
          # Signal sources (optional — pipeline falls back to pure AI if missing)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRODUCT_HUNT_TOKEN: ${{ secrets.PRODUCT_HUNT_TOKEN }}
        run: node scripts/generate-daily-content.js

      - name: Normalize affiliate links
        env:
          AMAZON_AFFILIATE_TAG: ${{ secrets.AMAZON_AFFILIATE_TAG }}
        run: node scripts/normalize-affiliate-links.js

      - name: Upgrade new products to direct ASIN links
        env:
          AMAZON_AFFILIATE_TAG: ${{ secrets.AMAZON_AFFILIATE_TAG }}
        run: node scripts/fetch-product-asins.js
        continue-on-error: true

      - name: Validate JSON files
        run: node scripts/validate-data.js

      - name: AdSense content quality gate
        run: node scripts/audit-adsense-content.mjs --strict

      - name: Validate outbound URLs (recent items)
        run: node scripts/validate-urls.js --recent
        continue-on-error: true

      - name: Assign editorial badges
        run: node scripts/assign-badges.js

      - name: Generate today's picks
        run: node scripts/generate-todays-picks.js

      - name: Populate collections
        run: node scripts/populate-collections.js

      - name: Enrich items with outside signals
        # New items + up to 20 stale re-checks: GitHub stats and a matched
        # YouTube walkthrough. Free (no paid APIs), so it runs every edition.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/enrich-signals.js --refresh 20
        continue-on-error: true

      - name: Install Playwright chromium for screenshots
        if: steps.budget.outputs.refresh_media == 'true'
        run: npx playwright install --with-deps chromium

      - name: Capture website screenshots for new items
        # Self-hosted screenshots (public/screenshots/*.webp) — skips items
        # that already have a file, so daily runs only capture the ~10 new
        # ones. A site that blocks headless browsers just falls back to the
        # cached photo in the UI.
        if: steps.budget.outputs.refresh_media == 'true'
        run: node scripts/capture-screenshots.mjs
        continue-on-error: true

      - name: Fetch images for new items
        if: steps.budget.outputs.refresh_media == 'true'
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: npx tsx scripts/fetch-images.ts
        continue-on-error: true

      - name: Product commerce accuracy gate
        env:
          AMAZON_AFFILIATE_TAG: ${{ secrets.AMAZON_AFFILIATE_TAG }}
        run: node scripts/audit-product-commerce.mjs

      - name: Build site
        run: npm run build

      - name: Refresh Obsidian vault dashboard
        # The repo doubles as an Obsidian vault; this keeps docs/Surfaced-HQ.md
        # showing the real state of the site instead of a stale snapshot.
        run: node scripts/generate-vault-dashboard.mjs

      - name: Notify IndexNow of fresh sitemap
        # Previously only the (now-retired) trending-live workflow pinged
        # IndexNow. Daily editions rebuild the whole sitemap, so ping here.
        # Best-effort: a Bing/Yandex 5xx must not fail the edition.
        continue-on-error: true
        run: npm run seo:ping

      - name: Send newsletter
        if: steps.budget.outputs.send_newsletter == 'true'
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: node scripts/send-newsletter.mjs
        continue-on-error: true

      - name: Commit and push
        run: |
          git config user.name "Surfaced Bot"
          git config user.email "bot@surfaced.daily"
          node scripts/validate-data.js
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "📰 Daily edition: $(date +%Y-%m-%d)"
          # Retry push up to 3x — trending-live and social-posts can push
          # from parallel workflows; a transient race must not waste a 30-min
          # Gemini-call generation run.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main
            if git push; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
          done
          echo "Push failed after 3 attempts"
          exit 1

  alert-on-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: daily-update
    if: failure()
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create GitHub Issue for failed run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const title = `⚠️ Daily edition failed — ${new Date().toISOString().split('T')[0]}`;
            const body = [
              `The **Daily Surfaced Edition** workflow failed.`,
              ``,
              `**Run:** https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `**Branch:** \`${context.ref}\``,
              `**Triggered by:** ${context.eventName}`,
              ``,
              `Check the run logs to see which step errored. The site content is now stale until this is resolved.`,
              ``,
              `Close this issue once the problem is fixed and a successful run completes.`
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['bug', 'automation']
            });

      - name: Notify Slack webhook
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          WORKFLOW_NAME: Daily Surfaced Edition
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not configured; GitHub issue notification created."
            exit 0
          fi
          node -e 'process.stdout.write(JSON.stringify({ text: `Surfaced automation failed: ${process.env.WORKFLOW_NAME}\n${process.env.RUN_URL}` }))' \
            | curl -fsS -X POST -H "Content-Type: application/json" --data @- "$SLACK_WEBHOOK_URL"
